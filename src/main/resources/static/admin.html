<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="/css/admin.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        <h2>Job Portal</h2>
    </div>

    <div class="nav-links">

        <a href="index.html">Home</a>

        <a href="jobs.html">Jobs</a>

        <a href="dashboard.html">Dashboard</a>

        <button onclick="logout()">
            Logout
        </button>

    </div>

</nav>
<header>

    <h1>Admin Dashboard</h1>

    <p>
        Manage Jobs, Users and Applications
    </p>

</header>

<!-- Dashboard Cards -->

<section class="cards">

    <div class="card">
        <h3>Total Jobs</h3>
        <h1 id="totalJobs">0</h1>
    </div>

    <div class="card">
        <h3>Total Users</h3>
        <h1 id="totalUsers">0</h1>
    </div>

    <div class="card">
        <h3>Applications</h3>
        <h1 id="totalApplications">0</h1>
    </div>

    <div class="card">
        <h3>Companies</h3>
        <h1 id="totalCompanies">0</h1>
    </div>

</section>

<!-- Add Job -->

<section class="jobSection">

    <h2>Add New Job</h2>

    <form id="jobForm">

        <input
                type="text"
                id="title"
                placeholder="Job Title"
                required>

        <input
                type="text"
                id="company"
                placeholder="Company"
                required>

        <input
                type="text"
                id="location"
                placeholder="Location"
                required>

        <input
                type="number"
                id="salary"
                placeholder="Salary"
                required>

        <input
                type="text"
                id="skills"
                placeholder="Skills">

        <input
                type="number"
                id="experience"
                placeholder="Experience"
                required>

        <textarea
                id="description"
                placeholder="Job Description"
                required></textarea>

        <button type="submit">

            Add Job

        </button>

    </form>

</section>

<!-- Jobs -->

<section>

    <h2>Manage Jobs</h2>

    <table>

        <thead>

        <tr>

            <th>ID</th>

            <th>Title</th>

            <th>Company</th>

            <th>Location</th>

            <th>Salary</th>

            <th>Skills</th>

            <th>Experience</th>

            <th>Edit</th>

            <th>Delete</th>

        </tr>

        </thead>

        <tbody id="jobTable">

        </tbody>

    </table>

</section>

<!-- Applications -->

<section>

    <h2>Applications</h2>

    <table>

        <thead>

        <tr>

            <th>Name</th>

            <th>Email</th>

            <th>Phone</th>

            <th>Job</th>

            <th>Resume</th>

            <th>Status</th>

        </tr>

        </thead>

        <tbody id="applicationTable">

        </tbody>

    </table>

</section>

<script src="/js/admin.js"></script>

</body>

</html>
